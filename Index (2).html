<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کافه ثمر</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #1a120b 0%, #2b1d12 50%, #1a120b 100%);
    color: #f3e9dc;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 16px;
  }
  .menu-card {
    width: 100%;
    max-width: 560px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(212,165,116,0.25);
    border-radius: 24px;
    padding: 48px 36px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
  }
  header { text-align: center; margin-bottom: 40px; }
  .logo { font-size: 44px; }
  h1 { font-weight: 800; font-size: 30px; color: #d4a574; letter-spacing: 1px; }
  .tagline { margin-top: 8px; color: #b9a68e; font-size: 14px; font-weight: 300; }
  .divider {
    height: 1px; margin: 28px 0;
    background: linear-gradient(90deg, transparent, #d4a574, transparent);
  }
  .menu-list { list-style: none; }
  .menu-list li {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 14px 4px;
    transition: background .2s;
    border-radius: 10px;
  }
  .menu-list li:hover { background: rgba(212,165,116,0.08); }
  .name { font-size: 18px; font-weight: 600; }
  .dots { flex: 1; margin: 0 12px; border-bottom: 1px dotted rgba(212,165,116,0.4); }
  .price { font-size: 17px; font-weight: 800; color: #d4a574; white-space: nowrap; }
  .price small { font-size: 12px; font-weight: 300; color: #b9a68e; margin-right: 3px; }
  footer {
    text-align: center;
    margin-top: 36px;
    color: #8a7a65;
    font-size: 13px;
    font-weight: 300;
  }
  .pay-btn {
    display: block;
    text-align: center;
    margin: 28px auto 0;
    padding: 16px 40px;
    max-width: 320px;
    background: linear-gradient(135deg, #d4a574, #b98a4e);
    color: #1a120b;
    font-size: 17px;
    font-weight: 800;
    border-radius: 14px;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(212,165,116,0.35);
    transition: transform .2s, box-shadow .2s;
  }
  .pay-btn:active {
    transform: scale(0.97);
    box-shadow: 0 4px 12px rgba(212,165,116,0.25);
  }
</style>
</head>
<body>
  <div class="menu-card">
    <header>
      <div class="logo">☕</div>
      <h1>منوی کافه</h1>
      <p class="tagline">یک حس خوب رو به خودت هدیه بده!</p>
    </header>
    <div class="divider"></div>
    <ul class="menu-list">
      <li><span class="name">آیس لته</span><span class="dots"></span><span class="price">۱۲۰<small>هزار تومان</small></span></li>
      <li><span class="name">لته</span><span class="dots"></span><span class="price">۱۰۰<small>هزار تومان</small></span></li>
      <li><span class="name">آیس آمریکانو</span><span class="dots"></span><span class="price">۹۰<small>هزار تومان</small></span></li>
      <li><span class="name">اسپرسو وان</span><span class="dots"></span><span class="price">۷۵<small>هزار تومان</small></span></li>
      <li><span class="name">اسپرسو دبل</span><span class="dots"></span><span class="price">۹۵<small>هزار تومان</small></span></li>
      <li><span class="name">چای</span><span class="dots"></span><span class="price">۵۰<small>هزار تومان</small></span></li>
      <li><span class="name">ماسالا</span><span class="dots"></span><span class="price">۱۱۰<small>هزار تومان</small></span></li>
    </ul>
    <div class="divider"></div>
    <a class="pay-btn" href="https://blubiz.sb24.com/s/j7ScpfYe" target="_blank">☕ ثبت سفارش و پرداخت</a>
    <footer>جهت سفارش با مدیریت آموزشگاه هماهنگ کنید</footer>
  </div>
</body>
</html>
